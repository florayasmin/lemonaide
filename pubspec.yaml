name: lemonaide
description: A gamified financial literacy assistant for kids.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.13.0
  firebase_auth: ^5.5.2
  cloud_firestore: ^5.6.6
  firebase_analytics: ^11.4.4

  # State & navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # UI
  flutter_animate: ^4.5.2
  flutter_svg: ^2.0.17
  google_fonts: ^6.2.1

  # Utilities
  equatable: ^2.0.7
  intl: ^0.20.2
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
